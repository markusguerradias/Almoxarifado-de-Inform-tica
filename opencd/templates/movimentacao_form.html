{% extends "base.html" %}
{% block title %}Nova movimentação - Almoxarifado{% endblock %}
{% block content %}
<div class="painel">
    <h2>Registrar movimentação</h2>
    <form method="post">
        <label for="produto_id">Produto *</label>
        <select id="produto_id" name="produto_id" required style="width:100%">
            <option value="">Selecione...</option>
            {% for p in produtos %}
            <option value="{{ p.id }}" {% if request.args.get('produto') == p.id|string %}selected{% endif %}>
                {{ p.nome }} (estoque atual: {{ p.quantidade }})
            </option>
            {% endfor %}
        </select>

        <label for="tipo">Tipo de movimentação *</label>
        <select id="tipo" name="tipo" required style="width:100%">
            <option value="entrada">Entrada (recebimento)</option>
            <option value="saida">Saída (retirada/uso)</option>
        </select>

        <label for="quantidade">Quantidade *</label>
        <input type="number" id="quantidade" name="quantidade" min="1" required style="width:100%">

        <label for="observacao">Observação</label>
        <textarea id="observacao" name="observacao" rows="2" style="width:100%"></textarea>

        <div style="margin-top:18px; display:flex; gap:10px;">
            <button class="btn primario" type="submit">Registrar</button>
            <a class="btn secundario" href="{{ url_for('movimentacoes') }}">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
