{% extends "base.html" %}
{% block title %}{{ 'Editar' if produto else 'Novo' }} produto - Almoxarifado{% endblock %}
{% block content %}
<div class="painel">
    <h2>{{ 'Editar produto' if produto else 'Cadastrar novo produto' }}</h2>
    <form method="post">
        <div class="form-grid">
            <div>
                <label for="nome">Nome *</label>
                <input type="text" id="nome" name="nome" required value="{{ produto.nome if produto else '' }}" style="width:100%">
            </div>
            <div>
                <label for="categoria_id">Categoria</label>
                <select id="categoria_id" name="categoria_id" style="width:100%">
                    <option value="">Sem categoria</option>
                    {% for c in categorias %}
                    <option value="{{ c.id }}" {% if produto and produto.categoria_id == c.id %}selected{% endif %}>{{ c.nome }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="inteiro">
                <label for="descricao">Descrição</label>
                <textarea id="descricao" name="descricao" rows="2" style="width:100%">{{ produto.descricao if produto else '' }}</textarea>
            </div>
            <div>
                <label for="fornecedor">Fornecedor</label>
                <input type="text" id="fornecedor" name="fornecedor" value="{{ produto.fornecedor if produto else '' }}" style="width:100%">
            </div>
            <div>
                <label for="localizacao">Localização (prateleira/armário)</label>
                <input type="text" id="localizacao" name="localizacao" value="{{ produto.localizacao if produto else '' }}" style="width:100%">
            </div>
            <div>
                <label for="quantidade">Quantidade em estoque</label>
                <input type="number" id="quantidade" name="quantidade" min="0" value="{{ produto.quantidade if produto else 0 }}" style="width:100%">
            </div>
            <div>
                <label for="quantidade_minima">Quantidade mínima (alerta)</label>
                <input type="number" id="quantidade_minima" name="quantidade_minima" min="0" value="{{ produto.quantidade_minima if produto else 0 }}" style="width:100%">
            </div>
            <div>
                <label for="preco">Preço unitário (R$)</label>
                <input type="number" id="preco" name="preco" step="0.01" min="0" value="{{ produto.preco if produto else '0.00' }}" style="width:100%">
            </div>
        </div>
        <div style="margin-top:18px; display:flex; gap:10px;">
            <button class="btn primario" type="submit">Salvar</button>
            <a class="btn secundario" href="{{ url_for('produtos') }}">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
